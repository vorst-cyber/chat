<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JECKGPT – AI Pribadi</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Font & Ikon (opsional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="assets/logo.svg" alt="JECKGPT" />
                <h1>JECKGPT</h1>
            </div>
            <div class="header-actions">
                <button id="clearBtn" title="Hapus percakapan">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button id="exportBtn" title="Ekspor chat">
                    <i class="fas fa-file-export"></i>
                </button>
            </div>
        </header>

        <!-- Chat area -->
        <main id="chatContainer">
            <div id="messages"></div>
            <div id="typingIndicator" class="hidden">
                <span></span><span></span><span></span>
            </div>
        </main>

        <!-- Input area -->
        <footer>
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Ketik pesan..."></textarea>
                <button id="sendBtn" title="Kirim">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <p class="footer-note">JECKGPT menggunakan Google Gemini API</p>
        </footer>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="script.js"></script>
</body>
</html>
